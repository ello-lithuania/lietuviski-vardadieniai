[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "naujagimiu-vardai"
version = "1.0.0"
description = "Populiariausi Lietuvos naujagimių vardai 2024 m. (Registrų centro duomenys) – biblioteka ir CLI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "DATA_LICENSE"]
authors = [{ name = "KokybiskaSvetaine.lt (Justas Arbatauskis)", email = "info@kokybiskasvetaine.lt" }]
keywords = ["vardai", "naujagimiai", "baby names", "Lithuania", "Lithuanian", "krikšto vardai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Lithuanian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://krikstynudovana.lt/kriksto-vardai/"
Source = "https://github.com/ello-lithuania/lietuviski-vardadieniai"
Issues = "https://github.com/ello-lithuania/lietuviski-vardadieniai/issues"

[project.scripts]
naujagimiu-vardai = "naujagimiu_vardai.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
naujagimiu_vardai = ["data/*.json"]
